# ElasticMQ (SQS-compatible) for the local Phase 2 stack (docker-compose.phase2.yml). Local use only.
#
# The queues mirror what the design asks of SQS (ADR 0019 / design 6.3, 6.7, 6.12):
#   pg-judgement.fifo      FIFO, MessageGroupId = machine, deduplication id = job id (no content-based dedup),
#                          visibility timeout 60 s, redrive to the DLQ after maxReceiveCount 3
#   pg-judgement-dlq.fifo  dead letters
# Message retention (DLQ 4 days) is not enforced by ElasticMQ; that is checked at the AWS step.
include classpath("application.conf")

# "*" = answer with the host the client used, so the same queue works from the compose network and from the host.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  "pg-judgement-dlq.fifo" {
    defaultVisibilityTimeout = 30 seconds
    fifo = true
    contentBasedDeduplication = false
  }
  "pg-judgement.fifo" {
    defaultVisibilityTimeout = 60 seconds
    fifo = true
    contentBasedDeduplication = false
    deadLettersQueue {
      name = "pg-judgement-dlq.fifo"
      maxReceiveCount = 3
    }
  }
}
