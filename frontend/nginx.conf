# Serves the built React app and passes /api/ on to the backend container.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Devices upload photos up to 15 MB (backend MAX_UPLOAD_MB). The nginx default is 1 MB.
    client_max_body_size 16m;

    # Look the backend up through Docker's DNS on each use instead of once at startup.
    # Otherwise nginx keeps the old address after the backend container is recreated (502).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:5000;
        proxy_pass $backend;

        # Keep the address the browser used, so links the backend builds (image URLs) point here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The first photo after a start waits for the AI models to load.
        proxy_read_timeout 120s;
    }

    # Build output file names contain a content hash, so they can be cached for a long time.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other path is a page of the React app (client-side routing).
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
