# 컨테이너 이미지 빌드 → ECR 푸시.
#
# 언제: develop / main 에 push 되고 backend/ 또는 frontend/ 가 바뀌었을 때. 수동 실행(workflow_dispatch)도 가능.
# 인증: GitHub OIDC → AWS IAM 역할(infra 리포 data 스택 cicd.tf). 장기 Access Key 없음.
#       역할 ARN 은 Repository variable AWS_ROLE_ARN. 역할의 신뢰 정책이 이 리포의 develop/main 브랜치만 허용한다.
# 태그: 커밋 짧은 해시(7자). ECR 태그가 불변(IMMUTABLE)이라 같은 태그를 다시 푸시할 수 없으므로,
#       이미 있는 태그면 빌드를 건너뛴다(같은 커밋을 재실행해도 실패하지 않는다).
# 이미지 3개 (Phase 1, 설계 9.1): Dockerfile 의 멀티 타깃을 컴포넌트마다 고른다.
#       backend   --target api        API 만. torch / YOLOv5 / OpenCV 없음 (약 84 MB 압축). Prototype 이미지(기본 타깃)가 아니다
#       inference --target inference  두 모델 + 추론 서비스 (torch 포함, 압축 약 625 MB)
#       frontend  (타깃 없음)
#       ECR 리포지토리 parking-guardian/inference 가 먼저 있어야 한다(infra data 스택 apply). 없으면 inference 잡이 실패하고,
#       update-config 가 모든 빌드를 기다리므로 태그 갱신도 일어나지 않는다. 그래서 이 파일은 apply 뒤에 push 한다.
# inference 빌드는 YOLOv5 소스를 두 번째 빌드 컨텍스트 "yolov5" 로 받는다(Dockerfile 머리말). 로컬에선 docker-compose 가
#       ../yolov5 를 넘기고, 여기서는 ultralytics/yolov5 를 로컬과 같은 커밋으로 checkout 해서 넘긴다. api 타깃은 쓰지 않는다.
# 2단계: 세 이미지가 ECR 에 있으면 config 리포(Parking-guardian-config)의 kustomization.yaml 에서 images: 의 newTag 세 줄을
#       이 커밋 해시로 바꿔 커밋·푸시한다. 권한은 Fine-grained PAT(Secret CONFIG_REPO_TOKEN, config 리포 Contents 쓰기만).
#       클러스터 적용(kubectl apply -k)은 Phase 1 에선 수동이다. 뒤 Phase 에 Argo CD 가 이 커밋을 보고 자동 적용한다.
name: Build and push images

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

# OIDC 토큰 발급(id-token)과 소스 checkout(contents)만. 기본 권한은 모두 끈다.
permissions:
  id-token: write
  contents: read

# 같은 브랜치의 이전 실행이 돌고 있어도 취소하지 않는다(푸시 중간에 끊긴 레이어가 남지 않게).
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  # 로컬 capston/yolov5 폴더와 같은 커밋 (ultralytics/yolov5, 2026-10-01). 바꾸면 Backend 이미지가 바뀐다.
  YOLOV5_COMMIT: 4add2aff6e3d926586a3eab4659f3b498dd444a1

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 하나가 실패해도 다른 쪽은 끝까지 간다
      matrix:
        include:
          # context: 빌드 컨텍스트 폴더. inference 의 소스와 Dockerfile 은 backend/ 에 있다(폴더 이름이 컴포넌트 이름과 같지 않다).
          - component: backend
            context: ./backend
            target: api
            yolov5: false
          - component: frontend
            context: ./frontend
            target: ""
            yolov5: false
          - component: inference
            context: ./backend
            target: inference
            yolov5: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # inference 이미지는 2.7 GB(압축 전). 러너의 기본 디스크(약 14 GB 여유)가 빌드 캐시까지 감당하도록 안 쓰는 SDK 를 지운다.
      - name: Free disk space (inference only)
        if: matrix.yolov5
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout YOLOv5 (inference only)
        if: matrix.yolov5
        uses: actions/checkout@v4
        with:
          repository: ultralytics/yolov5
          ref: ${{ env.YOLOV5_COMMIT }}
          path: yolov5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ matrix.component }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image name and tag
        id: meta
        run: |
          echo "repository=parking-guardian/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr.outputs.registry }}/parking-guardian/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # 불변 태그: 이미 있으면 푸시가 거부되므로 먼저 확인하고 건너뛴다.
      - name: Check whether the tag already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "${{ steps.meta.outputs.repository }}" \
               --image-ids imageTag="${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} already exists. Skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # 노드는 x86_64(m7i) 이므로 linux/amd64 로 고정. Dockerfile 의 --mount=type=cache 는 BuildKit(buildx)이 필요하다.
      # 레이어 캐시는 GitHub Actions 캐시(리포당 10 GB, 오래된 것부터 삭제). 캐시가 비어도 빌드는 된다(느릴 뿐).
      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Dockerfile 의 멀티 타깃. frontend 는 Dockerfile 이 하나라 빈 문자열(= 무시).
          target: ${{ matrix.target }}
          # inference 만 두 번째 컨텍스트. 나머지는 빈 문자열이라 무시된다.
          build-contexts: ${{ matrix.yolov5 && 'yolov5=./yolov5' || '' }}
          platforms: linux/amd64
          push: true
          provenance: false # 단일 매니페스트로 푸시(provenance 를 켜면 인덱스 + untagged 조각이 생긴다)
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
            echo '```'
            if [ "${{ steps.exists.outputs.exists }}" = "true" ]; then echo "_already existed, build skipped_"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # 2단계: config 리포의 이미지 태그 갱신. build 매트릭스(backend, frontend, inference) 셋 다 성공해야 실행된다.
  # 빌드가 "이미 있는 태그" 로 건너뛴 경우에도 실행된다(태그가 ECR 에 있는 것은 같으므로).
  # ---------------------------------------------------------------------------------------------
  update-config:
    name: update config repo image tags
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 앱 리포가 아니라 config 리포를 받는다. GITHUB_TOKEN 은 다른 리포에 push 할 수 없으므로 PAT 를 쓴다.
      # persist-credentials 기본값 true 라 뒤의 git push 가 같은 토큰을 쓴다.
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: Containerxox/Parking-guardian-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      # kustomize edit set image 는 파일을 다시 써서 주석이 사라진다. newTag 세 줄만 정규식으로 바꾼다.
      # 패턴이 없으면(파일 구조가 바뀌었으면) 실패시켜서 조용히 넘어가지 않게 한다.
      - name: Set image tags in kustomization.yaml
        id: set
        working-directory: config/apps/parking-guardian
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 - "$TAG" <<'PY'
          import re, sys, pathlib
          tag = sys.argv[1]
          path = pathlib.Path("kustomization.yaml")
          text = path.read_text(encoding="utf-8")
          for image in ("parking-guardian/backend", "parking-guardian/frontend", "parking-guardian/inference"):
              # newTag 는 반드시 따옴표로 쓴다. 숫자만으로 된 해시(예: 3993669)를 그대로 두면 YAML 이 정수로 읽어
              # kustomize build 가 "cannot unmarshal number into ... newTag of type string" 으로 실패한다(2026-10-28 실제 발생).
              pattern = re.compile(r"(- name: " + re.escape(image) + r"\n\s+newTag: )\S+")
              text, n = pattern.subn(r"\g<1>" + '"' + tag + '"', text)
              if n != 1:
                  sys.exit(f"images: 에서 {image} 의 newTag 를 찾지 못했다 (matches={n})")
          path.write_text(text, encoding="utf-8", newline="\n")
          print(text[text.index("images:"):])
          PY

      # 같은 커밋을 재실행하면 바뀐 것이 없다. 그때는 커밋하지 않고 끝낸다.
      - name: Commit and push
        working-directory: config
        env:
          TAG: ${{ steps.set.outputs.tag }}
          APP_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if git diff --quiet; then
            echo "::notice::images: 태그가 이미 $TAG 이다. 커밋할 것이 없다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/parking-guardian/kustomization.yaml
          git commit -m "deploy: backend·frontend·inference 이미지 태그 $TAG" -m "앱 커밋: $APP_COMMIT_URL" -m "by ${{ github.workflow }} run ${{ github.run_id }}"
          # 다른 커밋이 먼저 들어갔으면 한 번 rebase 하고 다시 push 한다.
          git push || (git pull --rebase && git push)
          echo "### config repo" >> "$GITHUB_STEP_SUMMARY"
          echo "images: newTag → \`$TAG\` ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
